# Banking modern data stack: Postgres (OLTP) -> Debezium/Kafka (CDC) -> Parquet in an
# S3-compatible store -> Airflow -> Snowflake -> dbt.
#
#   scripts/init-env.sh          # generate .env with random secrets
#   docker compose up -d --build
#
# Needs ~8 GB RAM / 4 vCPU. Ports are published on BIND_ADDRESS (default 127.0.0.1):
# reach the UIs over an SSH tunnel, see README.
name: banking-mds

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-s3-env: &s3-env
  S3_ENDPOINT: http://rustfs:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
  S3_BUCKET: ${S3_BUCKET:-banking-cdc}

x-snowflake-env: &snowflake-env
  SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
  SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
  SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
  SNOWFLAKE_PRIVATE_KEY_PATH: ${SNOWFLAKE_PRIVATE_KEY_PATH:-}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
  SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
  SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-BANKING_WH}
  SNOWFLAKE_DB: ${SNOWFLAKE_DB:-BANKING}
  SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: banking-mds/airflow:3.3.2
  restart: unless-stopped
  logging: *logging
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /tmp/airflow_simple_auth_passwords.json
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
    INGEST_SCHEDULE: ${INGEST_SCHEDULE:-*/15 * * * *}
    DBT_SCHEDULE: ${DBT_SCHEDULE:-@daily}
    <<: [*s3-env, *snowflake-env]
  volumes:
    - ./docker/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./secrets:/run/secrets/snowflake:ro
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  # ------------------------------------------------------------------ source database
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    # logical decoding for Debezium; the slot WAL cap stops a dead connector from filling the disk
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c max_slot_wal_keep_size=2GB
    volumes:
      - postgres_data:/var/lib/postgresql   # PG18+ keeps data in a versioned subdirectory
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ streaming
  kafka:
    image: apache/kafka:4.3.1   # KRaft only; ZooKeeper no longer exists in Kafka 4
    restart: unless-stopped
    logging: *logging
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_RETENTION_HOURS:-48}
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.7.1.Final   # Debezium images are published on quay.io only
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: banking-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx1g
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0   # maintained fork of the abandoned provectus/kafka-ui
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
      connect:
        condition: service_started
    environment:
      KAFKA_CLUSTERS_0_NAME: banking
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?set in .env}
      DYNAMIC_CONFIG_ENABLED: "false"   # cluster list is fixed by this file
    ports:
      - "8081:8080"   # 8080 is Airflow

  connector-init:
    build: ./kafka-debezium
    image: banking-mds/connector-init:1
    restart: "no"
    logging: *logging
    depends_on:
      connect:
        condition: service_started   # the script itself waits for the REST API
    environment:
      CONNECT_URL: http://connect:8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ------------------------------------------------------------------ object store (S3 API)
  # MinIO's community images were discontinued (Oct 2025) and the repo archived (Apr 2026);
  # RustFS is an Apache-2.0, S3-compatible replacement (1.0 GA, Sep 2026).
  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------------ pipeline workers
  consumer:
    build: ./consumer
    image: banking-mds/consumer:1
    restart: unless-stopped
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
      rustfs:
        condition: service_started   # consumer retries until the bucket is reachable
      connector-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_GROUP: banking-s3-sink
      BATCH_SIZE: ${CONSUMER_BATCH_SIZE:-50}
      FLUSH_INTERVAL_SECONDS: ${CONSUMER_FLUSH_SECONDS:-10}
      <<: *s3-env
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  data-generator:
    build: ./data-generator
    image: banking-mds/data-generator:1
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      GEN_NUM_CUSTOMERS: ${GEN_NUM_CUSTOMERS:-10}
      GEN_ACCOUNTS_PER_CUSTOMER: ${GEN_ACCOUNTS_PER_CUSTOMER:-2}
      GEN_NUM_TRANSACTIONS: ${GEN_NUM_TRANSACTIONS:-50}
      GEN_SLEEP_SECONDS: ${GEN_SLEEP_SECONDS:-30}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ------------------------------------------------------------------ Airflow 3
  airflow-postgres:
    image: postgres:17.11-alpine   # Airflow metadata DB (PG17: supported until Nov 2029)
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    command: ["bash", "-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow-common
    command: ["bash", "/opt/airflow/start-api-server.sh"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8974/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]

  # One-shot: creates the Snowflake warehouse / database / RAW tables (idempotent).
  # It fails harmlessly until the SNOWFLAKE_* values in .env are filled in.
  snowflake-init:
    <<: *airflow-common
    restart: "no"
    depends_on: {}
    command: ["python", "/opt/airflow/snowflake/init.py"]

volumes:
  postgres_data:
  kafka_data:
  rustfs_data:
  airflow_postgres_data:
  airflow_logs:

networks:
  default:
    name: banking-mds-net
